# Full stack: MongoDB + API + static frontend.
#   JWT_SECRET=<64 hex chars> docker compose up --build
# Frontend: http://localhost:8080   API: http://localhost:5000
# The browser must reach the API at VITE_API_URL (baked into the frontend build).
# For a real deployment use HTTPS and put the app and API on the same site
# (e.g. app.example.com and api.example.com) because the auth cookie is SameSite=Lax.
services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    # Not published to the host on purpose.

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      NODE_ENV: production
      PORT: "5000"
      MONGO_URI: mongodb://mongo:27017/anime-tracker
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (at least 32 chars)}
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: ${CLIENT_URL:-http://localhost:8080}
      ANILIST_API_URL: https://graphql.anilist.co
      TRUST_PROXY: ${TRUST_PROXY:-0}
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  mongo-data:
